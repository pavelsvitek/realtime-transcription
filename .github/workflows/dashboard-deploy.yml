name: Deploy Amie Dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/amie-dashboard/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-deploy.yml"
  workflow_dispatch:

concurrency:
  group: amie-dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter amie-dashboard typecheck

      - name: Lint
        run: pnpm --filter amie-dashboard lint

      - name: Build
        run: pnpm --filter amie-dashboard build

      - name: Deploy to Cloudflare Workers (dashboard.getamie.app)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/amie-dashboard
          command: deploy
