# Amie macOS release (Apple Silicon only) → draft GitHub Release + updater assets.
#
# Trigger:
#   - Push tag matching `app-v*` (e.g. app-v0.1.0). Tag version must match
#     apps/amie/src-tauri/tauri.conf.json (and Cargo.toml) version.
#   - workflow_dispatch for manual / dry runs (creates draft Release for the
#     version in tauri.conf.json).
#
# Required repository secret (minisign — Tauri updater):
#   TAURI_SIGNING_PRIVATE_KEY
#     Private key contents (or path contents) from:
#       pnpm tauri signer generate -w ~/.tauri/amie.key
#     Must match plugins.updater.pubkey in tauri.conf.json (real pubkey is
#     already embedded; keep this secret in sync with that keypair).
#
# Optional repository secret:
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Only if the private key was generated with a password.
#
# Required repository secrets (Apple Developer ID signing + notarization, so
# Gatekeeper opens the DMG and updates without "unidentified developer"):
#   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   password chosen when exporting the .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_PASSWORD               app-specific password for that Apple ID
#   APPLE_TEAM_ID                10-character team id
# See apps/amie/README.md → "Developer ID signing and notarization".
#
# Expected draft Release assets (darwin-aarch64):
#   - Amie_*.dmg (first-install)
#   - Amie.app.tar.gz (+ .sig) (updater payload)
#   - latest.json (uploader via uploadUpdaterJson)

name: amie-release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-macos-aarch64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager field in root package.json
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/amie/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Nemotron sidecar (release)
        run: |
          set -euo pipefail
          cd apps/amie/nemotron-helper
          swift build -c release --product nemotron-bridge
          test -x .build/release/nemotron-bridge

      - name: Fail fast if minisign private key secret is missing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "Generate with: pnpm tauri signer generate -w ~/.tauri/amie.key (from apps/amie)"
            echo "Put the public key in apps/amie/src-tauri/tauri.conf.json → plugins.updater.pubkey"
            echo "Store the private key as Actions secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Fail fast if Apple signing secrets are missing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see apps/amie/README.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build and upload draft GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater (minisign) — required for createUpdaterArtifacts / .sig / latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID signing: tauri-action imports the .p12 into a temporary
          # keychain; Tauri signs with the hardened runtime, then notarizes and
          # staples when the Apple ID credentials below are present.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/amie
          # Uses package.json "tauri" → scripts/tauri.sh (sidecar copy + signing gate).
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin
          tagName: app-v__VERSION__
          releaseName: Amie v__VERSION__
          # User-facing text shown in the updater dialog (Release body).
          # Technical draft/asset/endpoint notes stay in the workflow header comments above.
          releaseBody: |
            This update includes reliability improvements and bug fixes. Amie will restart automatically after the update.

            Your meetings and settings stay on this Mac.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      # Tauri notarizes and staples Amie.app but not the DMG that wraps it, so a
      # downloaded DMG is "Unnotarized Developer ID" to Gatekeeper. Notarize and
      # staple it here, then replace the draft Release's DMG with the stapled one.
      # The updater payload (Amie.app.tar.gz) is unaffected.
      - name: Notarize and staple DMG, re-upload to the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(find apps/amie/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo "::error::No DMG found to notarize"; exit 1; }

          # notarytool exits 0 even for an Invalid submission, so check the status.
          result="$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          status="$(echo "$result" | jq -r .status)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::DMG notarization finished with status: $status"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          version="$(jq -r .version apps/amie/src-tauri/tauri.conf.json)"
          gh release upload "app-v${version}" "$dmg" --clobber
